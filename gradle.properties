# Local Gradle config for the pipelinek-policy bootstrap.
# Toolchain auto-detection will find the system JDKs; the explicit path
# here is a fallback only used if auto-detection is unavailable, and
# never commits a user-specific absolute path.

org.gradle.jvmargs=-Xmx1g -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true

# Optional: known JDK install paths (commented out — auto-detect is
# preferred). Add local paths here if auto-detection fails on the
# developer machine. Do NOT uncomment with an absolute user path.
# org.gradle.java.installations.paths=/path/to/jdk-21

kotlin.daemon.jvmargs=-Xmx1g