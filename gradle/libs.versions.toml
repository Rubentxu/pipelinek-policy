[versions]
kotlin = "2.4.20"
kotlin-fir-spike = "2.4.10"  # M4.A: 2.4.10 mirrors the kotlin-reflect pin (M3); the cache only has full transitive metadata at 2.4.10 for compiler-embeddable + scripting SPI (docs/history/M4_SPIKE_RECEIPT.md §2).
junit = "5.10.2"
jackson = "2.15.3"
snakeyaml = "2.10"

[libraries]
kotlin-stdlib = { module = "org.jetbrains.kotlin:kotlin-stdlib", version.ref = "kotlin" }
kotlin-test-junit5 = { module = "org.jetbrains.kotlin:kotlin-test-junit5", version.ref = "kotlin" }
# M4.A (spike): `kotlin.compiler.embeddable` and `kotlin.scripting.compiler.embeddable`
# are wired ONLY in `policy-fir-plugin/`; the root module stays on the broad
# `coreAllowedCoords = { kotlin-stdlib }` allowlist. Version pinned to 2.4.10
# (see `kotlin-fir-spike` above) so the spike is reproducible offline without
# touching Maven Central. ADR-0011 D11.1 third-bucket policy applies.
kotlin-compiler-embeddable = { module = "org.jetbrains.kotlin:kotlin-compiler-embeddable", version.ref = "kotlin-fir-spike" }
kotlin-scripting-compiler-embeddable = { module = "org.jetbrains.kotlin:kotlin-scripting-compiler-embeddable", version.ref = "kotlin-fir-spike" }
# M4.A (spike): the Gradle-side `KotlinCompilerPluginSupportPlugin` SPI
# lives in `kotlin-gradle-plugin-api`. This is what the host Gradle runtime
# injects into the plugin classpath; the spike compiles against it as
# `compileOnly` so the produced jar does not bundle a Gradle plugin runtime.
kotlin-gradle-plugin-api = { module = "org.jetbrains.kotlin:kotlin-gradle-plugin-api", version.ref = "kotlin-fir-spike" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter", version.ref = "junit" }
# ADR-0011 D11.2: jackson-core only — no databind, no reflection (law 5).
# Pinned to 2.15.3 because that's the version available in the local
# offline Gradle cache; Jackson 2.18.x source-anchor semantics are stable
# across 2.15+ so the test contract holds at either version.
jackson-core = { module = "com.fasterxml.jackson.core:jackson-core", version.ref = "jackson" }
# ADR-0011 D11.2: snakeyaml-engine (org.snakeyaml) is the maintained fork
# that exposes the event API needed for alias/anchor caps and source-span
# tracking. Version 2.10 is the one cached locally; if a future pin to
# 2.x (say 2.9) is desired, bump libs.versions.toml and the dual allowlist
# together so the architectureFitnessGuard stays consistent.
snakeyaml-engine = { module = "org.snakeyaml:snakeyaml-engine", version.ref = "snakeyaml" }

[plugins]
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
detekt = { id = "dev.detekt", version = "2.0.0-alpha.6" }