[versions]
kotlin = "2.4.20"
junit = "5.10.2"
jackson = "2.15.3"
snakeyaml = "2.10"

[libraries]
kotlin-stdlib = { module = "org.jetbrains.kotlin:kotlin-stdlib", version.ref = "kotlin" }
kotlin-test-junit5 = { module = "org.jetbrains.kotlin:kotlin-test-junit5", version.ref = "kotlin" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter", version.ref = "junit" }
# ADR-0011 D11.2: jackson-core only — no databind, no reflection (law 5).
# Pinned to 2.15.3 because that's the version available in the local
# offline Gradle cache; Jackson 2.18.x source-anchor semantics are stable
# across 2.15+ so the test contract holds at either version.
jackson-core = { module = "com.fasterxml.jackson.core:jackson-core", version.ref = "jackson" }
# ADR-0011 D11.2: snakeyaml-engine (org.snakeyaml) is the maintained fork
# that exposes the event API needed for alias/anchor caps and source-span
# tracking. Version 2.10 is the one cached locally; if a future pin to
# 2.x (say 2.9) is desired, bump libs.versions.toml and the dual allowlist
# together so the architectureFitnessGuard stays consistent.
snakeyaml-engine = { module = "org.snakeyaml:snakeyaml-engine", version.ref = "snakeyaml" }

[plugins]
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
detekt = { id = "dev.detekt", version = "2.0.0-alpha.6" }